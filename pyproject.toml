[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ctfd-mcp-server"
version = "1.0.4"
description = "Model Context Protocol (MCP) server for CTFd v3 instances"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "MrJamescot" }]
keywords = ["mcp", "ctfd", "ctf", "ai", "agent", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "aiohttp>=3.9,<4",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "mcp>=1.0,<2",
    "fastmcp>=2.0",
]

[project.optional-dependencies]
rest = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
dev = [
    "pytest>=7",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/MrJamescot/ctfd-mcp-server"
Repository = "https://github.com/MrJamescot/ctfd-mcp-server"
Issues = "https://github.com/MrJamescot/ctfd-mcp-server/issues"

[project.scripts]
ctfd-mcp = "ctfd_mcp_server:main"
ctfd-rest = "server.main:run"

[tool.setuptools]
packages = ["server"]
py-modules = ["ctfd_mcp_server"]